<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تسجيل الدخول</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    nav {
      background-color: #004080;
      padding: 10px;
      position: absolute;
      top: 0;
      width: 100%;
    }
    nav ul {
      list-style-type: none;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
    }
    nav ul li {
      margin: 0 15px;
    }
    nav ul li a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
    nav ul li a:hover {
      text-decoration: underline;
    }
    .login-box {
      background-color: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px #aaa;
      width: 300px;
      margin-top: 100px;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    input[type="submit"] {
      width: 100%;
      padding: 10px;
      background-color: #004080;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    input[type="submit"]:hover {
      background-color: #0066cc;
    }
  </style>
</head>
<body>
  <nav>
    <ul>
      <li><a href="login.html">تسجيل الدخول</a></li>
      <li><a href="about.html">عني</a></li>
      <li><a href="history.html">تاريخ الكلية</a></li>
    </ul>
  </nav>
  <div class="login-box">
    <h2>تسجيل الدخول</h2>
    <form action="about.html">
      <label>اسم المستخدم</label>
      <input type="text" required>
      <label>كلمة المرور</label>
      <input type="password" required>
      <input type="submit" value="دخول">
    </form>
  </div>
</body>
</html>
